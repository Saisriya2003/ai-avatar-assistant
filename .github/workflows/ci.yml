name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    name: Build UI + smoke test chat API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test /api/chat
        run: |
          npm run server &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5060/api/health && break || sleep 1; done
          echo
          curl -sf -X POST http://127.0.0.1:5060/api/chat -H 'Content-Type: application/json' \
            -d '{"mode":"support","messages":[{"role":"user","text":"What is Lumen Cloud?"}]}'
          echo
